[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscan"
version = "0.2.0"
description = "Discover, inventory, and validate AI-agent assets (SKILL.md, MCP configs, CLAUDE.md/AGENTS.md, subagents) in a directory tree."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asadullah Shafique" }]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.scripts]
agentscan = "agentscan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "jsonschema>=4.0"]

[tool.setuptools.packages.find]
include = ["agentscan*"]

# IMPORTANT: catalog.yaml is a non-.py resource shipped inside the package.
# Without this section a real `pip install` would omit it and `agentscan`
# would crash at import of the catalog.
[tool.setuptools.package-data]
agentscan = ["catalog.yaml"]

# Pin lint config in the repo so a contributor's user-level ruff config cannot
# change what CI enforces. Default rule set (E4/E7/E9/F) plus import sorting.
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# Explicit `select`, not `extend-select`: newer ruff releases widen the default
# set (e.g. pyupgrade), which would silently change what CI enforces.
select = ["E4", "E7", "E9", "F", "I"]
