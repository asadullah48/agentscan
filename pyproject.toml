[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscan"
version = "0.2.0"
description = "Discover, inventory, and validate AI-agent assets (SKILL.md, MCP configs, CLAUDE.md/AGENTS.md, subagents) in a directory tree."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asadullah Shafique" }]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.scripts]
agentscan = "agentscan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["agentscan*"]

# IMPORTANT: catalog.yaml is a non-.py resource shipped inside the package.
# Without this section a real `pip install` would omit it and `agentscan`
# would crash at import of the catalog.
[tool.setuptools.package-data]
agentscan = ["catalog.yaml"]
